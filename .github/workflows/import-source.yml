name: Import project source

on:
  push:
    branches: [main]
    paths:
      - "keviv-dialer-source.tar.xz.b64"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand project source
        shell: bash
        run: |
          if [ ! -f keviv-dialer-source.tar.xz.b64 ]; then
            echo "Source archive was already imported."
            exit 0
          fi
          base64 --decode keviv-dialer-source.tar.xz.b64 | xz --decompress --stdout | tar -xf -
          rm keviv-dialer-source.tar.xz.b64
      - name: Commit extracted source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Import Keviv Dialer source [skip ci]"
          git push